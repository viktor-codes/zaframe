events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name api.zeeframe.com;

        # Для Certbot верификации
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное редиректим на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.zeeframe.com;

        # ssl_certificate /etc/letsencrypt/live/api.zeeframe.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/api.zeeframe.com/privkey.pem;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}