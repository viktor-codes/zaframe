name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docs/ARCHITECTURE.md"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docs/ARCHITECTURE.md"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeeframe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeeframe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-key-min-32-chars-for-ci
      DEBUG: "true"
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zeeframe

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Import boundaries
        run: uv run lint-imports

      - name: Pyright
        run: uv run pyright app scripts

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q --cov=app --cov-fail-under=75
