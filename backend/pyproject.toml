[project]
name = "ZeeFrame"
version = "0.1.0"
description = "Smart Booking System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.1",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "resend>=2.0.0",
    "stripe>=11.0.0",
    "slowapi>=0.1.9",
    "structlog>=25.5.0",
    "pyjwt>=2.13.0",
    "prometheus-client>=0.25.0",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.11",
    "pyright>=1.1.410",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "scripts", "tests", "alembic"]
exclude = [".venv", "alembic/versions", "**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends() / Query() in defaults — framework idiom
    "E402",  # Late imports in scripts / schema cycles
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# Tests are intentionally outside the strict Pyright gate for FR-12 stabilization.
# They remain covered by pytest; typing test fixtures/mocks is tracked as follow-up debt.
include = ["app", "scripts"]
exclude = [".venv", "alembic/versions", "tests"]
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false  # WHY: slowapi @limiter.limit ships without decorator typing

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.extend-per-file-ignores]
"app/models/**/*.py" = ["F821"]
"tests/**/*.py" = ["SIM117"]

# === import-linter: architecture boundary guards ===
# Final contracts — see docs/ARCHITECTURE.md and ADR-003.
# Run locally with: uv run lint-imports
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core infra does not import modules"
type = "forbidden"
source_modules = [
    "app.core.config",
    "app.core.security",
    "app.core.exceptions",
    "app.core.datetime_utils",
    "app.core.database",
    "app.core.repository",
    "app.core.uow",
]
forbidden_modules = ["app.modules"]
ignore_imports = [
    "app.core.uow -> app.modules.**",
]

[[tool.importlinter.contracts]]
name = "Models import nothing but core"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.modules", "app.api"]

[[tool.importlinter.contracts]]
name = "catalog does not depend on booking/payment/auth"
type = "forbidden"
source_modules = ["app.modules.catalog"]
forbidden_modules = ["app.modules.booking", "app.modules.payment", "app.modules.auth"]
ignore_imports = [
    "app.modules.catalog.** -> app.core.deps",
    "app.core.deps -> app.core.uow_factory",
    "app.core.uow_factory -> app.modules.**",
    "app.modules.catalog.** -> app.core.uow",
    "app.core.uow -> app.modules.**",
]

[[tool.importlinter.contracts]]
name = "identity is a leaf"
type = "forbidden"
source_modules = ["app.modules.identity"]
forbidden_modules = [
    "app.modules.auth",
    "app.modules.booking",
    "app.modules.catalog",
    "app.modules.payment",
    "app.modules.search",
]
ignore_imports = [
    "app.modules.identity.** -> app.core.uow",
    "app.core.uow -> app.modules.**",
]

[[tool.importlinter.contracts]]
name = "search is read-only leaf"
type = "forbidden"
source_modules = ["app.modules.search"]
forbidden_modules = [
    "app.modules.booking",
    "app.modules.catalog",
    "app.modules.payment",
    "app.modules.auth",
]
ignore_imports = [
    "app.modules.search.** -> app.core.deps",
    "app.core.deps -> app.core.uow_factory",
    "app.core.uow_factory -> app.modules.**",
    "app.modules.search.** -> app.core.uow",
    "app.core.uow -> app.modules.**",
]

[[tool.importlinter.contracts]]
name = "payment only reaches booking and identity (not catalog/auth)"
type = "forbidden"
source_modules = ["app.modules.payment"]
forbidden_modules = ["app.modules.catalog", "app.modules.auth"]
ignore_imports = [
    "app.modules.payment.** -> app.core.deps",
    "app.core.deps -> app.core.uow_factory",
    "app.modules.payment.** -> app.core.uow_factory",
    "app.core.uow_factory -> app.modules.auth.**",
    "app.core.uow_factory -> app.modules.catalog.**",
    "app.core.uow_factory -> app.modules.identity.**",
    "app.core.uow_factory -> app.modules.search.**",
    "app.modules.payment.** -> app.core.uow",
    "app.core.uow -> app.modules.**",
]

[[tool.importlinter.contracts]]
name = "Nothing imports the API layer"
type = "forbidden"
source_modules = ["app.modules", "app.core", "app.models"]
forbidden_modules = ["app.api"]
