# Render Blueprint: New -> Blueprint -> connect the repository.
# The service is built from the backend directory.
services:
  - type: web
    name: zeeframe-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Single free web instance: in-memory SlowAPI is acceptable until Redis is provisioned.
      - key: ALLOW_INMEMORY_RATE_LIMIT
        value: "true"
      # Required for GET /metrics in production (Authorization: Bearer <token>).
      - key: METRICS_TOKEN
        sync: false

  # Expire stale pending holds and complete past confirmed bookings (TD-11).
  # Schedule is UTC; */5 = every 5 minutes.
  - type: cron
    name: zeeframe-booking-lifecycle
    runtime: python
    plan: free
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.run_booking_lifecycle
    envVars:
      - key: DATABASE_URL
        sync: false
