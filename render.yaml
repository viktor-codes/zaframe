# Render Blueprint: New -> Blueprint -> connect the repository.
# The service is built from the backend directory.
#
# Rate limiting (production preference):
#   Prefer Render Key Value (Redis-compatible) + REDIS_URL, with
#   ALLOW_INMEMORY_RATE_LIMIT=false. Free web alone has no Redis — the
#   Blueprint keeps the single-instance escape hatch until you upgrade
#   (see docs/ops/closed-beta-checklist.md § Rate limiting).
services:
  - type: web
    name: zeeframe-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Fail the deploy if schema is behind — do not serve traffic on a stale DB.
    preDeployCommand: python -m alembic upgrade head
    # proxy-headers: trust X-Forwarded-* from Render's edge for ASGI URL scheme/host.
    # App rate limits only honor XFF when TRUSTED_PROXY_IPS matches the peer
    # (set after inspecting the Render edge peer; empty = peer IP only).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Preferred when Key Value is provisioned (wire via fromService — see checklist).
      - key: REDIS_URL
        sync: false
      # Escape hatch for free single-instance closed beta only.
      # After adding Key Value: set this to "false" (or delete) and set REDIS_URL.
      - key: ALLOW_INMEMORY_RATE_LIMIT
        value: "true"
      # Comma-separated proxy IPs/CIDRs for SlowAPI client IP (optional).
      - key: TRUSTED_PROXY_IPS
        sync: false
      # Required for GET /metrics in production (Authorization: Bearer <token>).
      - key: METRICS_TOKEN
        sync: false
      # Optional: Sentry DSN for API error reporting (unset = disabled).
      - key: SENTRY_DSN
        sync: false

  # Expire stale pending holds and complete past confirmed bookings (TD-11).
  # Schedule is UTC; */5 = every 5 minutes.
  - type: cron
    name: zeeframe-booking-lifecycle
    runtime: python
    plan: free
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.run_booking_lifecycle
    envVars:
      # Match web service; Settings defaults to `dev` without this.
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      # WHY: app.core.config.Settings requires SECRET_KEY at import time
      # (even though this job only needs DB access).
      - key: SECRET_KEY
        fromService:
          type: web
          name: zeeframe-api
          envVarKey: SECRET_KEY

# Optional upgrade (paid): uncomment and remove ALLOW_INMEMORY_RATE_LIMIT=true above.
# Key Value is not available on the free Blueprint path used for closed beta.
# services:
#   - type: keyvalue
#     name: zeeframe-redis
#     plan: starter
#     maxmemoryPolicy: noeviction
#     ipAllowList: []   # internal Render network only
# Then on zeeframe-api:
#   - key: REDIS_URL
#     fromService:
#       name: zeeframe-redis
#       type: keyvalue
#       property: connectionString
#   - key: ALLOW_INMEMORY_RATE_LIMIT
#     value: "false"
